# Publishing to crates.io — MANUAL fallback (break-glass only).
#
# This workflow used to trigger automatically on semantic tags v*.*.*. Since
# the release-plz automation (release.yml) now owns releases — and would
# otherwise try to publish the same version a second time — the tag trigger
# was replaced with `workflow_dispatch`. Use it only when release-plz is
# broken and you need to ship manually.
#
# What it does:
#   1. Verifies that Cargo.toml version matches the typed version.
#   2. Runs cargo publish --dry-run.
#   3. Runs cargo publish using CARGO_REGISTRY_TOKEN.
#   4. Creates a GitHub Release.

name: Publish (manual fallback)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the version to publish (e.g. 0.9.1)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check-version:
    name: Check typed version matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from workflow input
        id: typed
        run: echo "version=${{ github.event.inputs.confirm }}" >> $GITHUB_OUTPUT

      - name: Extract version from Cargo.toml
        id: cargo
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Assert typed version == Cargo.toml version
        run: |
          TYPED="${{ steps.typed.outputs.version }}"
          CARGO="${{ steps.cargo.outputs.version }}"
          echo "Typed version:   $TYPED"
          echo "Cargo version:   $CARGO"
          if [ "$TYPED" != "$CARGO" ]; then
            echo "ERROR: typed version v$TYPED does not match Cargo.toml version $CARGO"
            echo "Update [package] version in Cargo.toml before publishing."
            exit 1
          fi
          echo "Version OK: $TYPED"

  dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --allow-dirty

  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    needs: dry-run
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
