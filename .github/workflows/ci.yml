# Main CI pipeline: code quality, tests, docs, MSRV, audit.
# Runs on every push and PR.
#
# Jobs:
#   fmt      — formatting (cargo fmt + taplo)
#   clippy   — static analysis, all feature combinations
#   test     — cargo test (default, std, defmt, std+defmt, serde)
#   coverage — cargo-llvm-cov over --all-features + doctests, uploaded to Codecov
#   bench    — benchmark smoke-check (compile + run, no timing assertions)
#   docs     — cargo doc with no warnings
#   deny     — licenses and CVE audit (cargo deny)
#   msrv     — MSRV check = Rust 1.75
#   embedded — invokes embedded.yml as a reusable workflow
#   fuzz     — invokes fuzz.yml as a reusable workflow (30 s smoke per target)
#   semver-checks — API breaking-change gate vs the last crates.io release

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Setup taplo
        uses: uncenter/setup-taplo@v2
        with:
          version: "0.9.3"

      - name: taplo fmt --check (TOML files)
        run: taplo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: clippy — default features
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy — std feature
        run: cargo clippy --all-targets --features std -- -D warnings

      - name: clippy — defmt feature
        run: cargo clippy --all-targets --features defmt -- -D warnings

      - name: clippy — serde feature
        run: cargo clippy --all-targets --features serde -- -D warnings

      - name: clippy — all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify #![forbid(unsafe_code)]
        run: grep -n "forbid(unsafe_code)" src/lib.rs

      - name: Verify #![deny(missing_docs)]
        run: grep -n "deny(missing_docs)" src/lib.rs

  test:
    name: Test (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "" # default (no_std)
          - "std" # includes prop_tests (proptest)
          - "defmt"
          - "std,defmt"
          - "serde" # includes serde_test integration tests
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14

      - name: Normalize features for cache key
        id: norm
        run: |
          KEY="${{ matrix.features }}"
          echo "key=${KEY//,/-}" >> $GITHUB_OUTPUT

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ steps.norm.outputs.key }}-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -z "$FEATURES" ]; then
            cargo test
          else
            cargo test --features "$FEATURES"
          fi

  coverage:
    name: Coverage (llvm-cov + Codecov)
    runs-on: ubuntu-latest
    env:
      # cargo-llvm-cov adds its own instrumentation flags; the workflow-wide
      # `-D warnings` would conflict with them and fail on warnings that only
      # appear under instrumentation, which is not what this job gates on.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

      # --all-features: serde_impls.rs, the defmt::Format impls and the
      # std::error::Error impl are feature-gated; measuring without them would
      # report whole files as 0% and drag the total down.
      # --doctests: doctests exercise real conversion paths from public-item
      # examples, a meaningful share of coverage (requires nightly).
      # Single invocation: covers unit + integration + doctests in one profile,
      # mirroring the main `test` job instead of a separate nextest runner.
      - name: Collect coverage + generate lcov
        run: cargo llvm-cov test --all-features --doctests --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov report --summary-only

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      # Keep the raw report even if the Codecov upload fails, so the run's
      # data is never lost.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov-${{ github.sha }}
          path: lcov.info
          retention-days: 14

  bench:
    name: Benchmark smoke + results artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo bench — smoke (compile and run, no timing assertions)
        run: cargo bench -p benches --locked -- --test

      - name: cargo bench — measured run (reduced timing for CI)
        run: >
          cargo bench -p benches --locked --
          --measurement-time 1 --warm-up-time 0.3 --sample-size 20

      - name: Upload criterion results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: target/criterion
          retention-days: 30

  fuzz:
    name: Fuzz smoke (30s per target)
    needs: [fmt, clippy]
    uses: ./.github/workflows/fuzz.yml

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14

      - name: cargo doc — all features, -D warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check
          arguments: --all-features

  msrv:
    name: MSRV 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"

      - name: cargo check — no features
        run: cargo check --lib --no-default-features

      - name: cargo check — std feature
        run: cargo check --lib --features std

      - name: cargo check — defmt feature
        run: cargo check --lib --no-default-features --features defmt

  semver-checks:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    # Only meaningful on PRs — there is nothing to compare a main push
    # against that release-plz does not already check at release time.
    if: github.event_name == 'pull_request'

    env:
      CARGO_TERM_COLOR: always
      # cargo-semver-checks builds rustdoc JSON for both the baseline and the
      # current version. `-D warnings` (set globally in this workflow) would
      # fail the job on warnings coming from the *published baseline*, which
      # is not something this PR can fix.
      RUSTFLAGS: ""

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # cargo-semver-checks needs a toolchain that can emit rustdoc JSON for
      # both versions. It manages its own nightly internally; stable here is
      # for the host build. RUSTUP_TOOLCHAIN set by this action overrides the
      # nightly pinned in rust-toolchain.toml.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-semver-checks-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      # Compares the PR's public API against the latest version published on
      # crates.io. Checks the default (no-feature) build and all features
      # separately, because a feature-gated item is still public API for
      # anyone enabling that feature — --all-features alone would miss a
      # break that only shows up in the default build, and vice versa.
      - name: semver-checks (default features)
        run: cargo semver-checks check-release --only-explicit-features

      - name: semver-checks (all features)
        run: cargo semver-checks check-release --all-features

  embedded:
    name: Embedded
    needs: [fmt, clippy]
    uses: ./.github/workflows/embedded.yml
