# Check no_std compatibility and cross-compilation for embedded targets.
#
# Targets:
#   thumbv7em-none-eabihf          — STM32F4/F7, nRF52 (Cortex-M4F/M7F with FPU)
#   thumbv7em-none-eabi            — Cortex-M4/M7 without FPU
#   thumbv6m-none-eabi             — Cortex-M0/M0+ (STM32F0xx, nRF51)
#   riscv32imac-unknown-none-elf   — ESP32-C3, GD32VF103 (RV32IMAC)
#   riscv32i-unknown-none-elf      — ESP32-C2 (RV32I, no atomics)
#
# Runs:
#   - standalone on push/PR to main/develop and on tags v*.*.*
#   - as a reusable workflow — invoked from ci.yml via workflow_call

name: embedded no_std

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call: # reusable: ci.yml invokes this workflow

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-compile:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - thumbv7em-none-eabi
          - thumbv6m-none-eabi
          - riscv32imac-unknown-none-elf
          - riscv32i-unknown-none-elf
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-embedded-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check — no features
        run: >
          cargo check --lib
          --no-default-features
          --target ${{ matrix.target }}

      - name: cargo check — defmt feature
        run: >
          cargo check --lib
          --no-default-features --features defmt
          --target ${{ matrix.target }}

  no-std-transitive:
    name: no_std tree pulls no std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14

      - name: Verify std is not pulled transitively
        run: |
          for features in "" "--features serde" "--features defmt"; do
            cargo tree -e normal --no-default-features $features > /tmp/deps.txt
            if grep -qE '(^| )std v' /tmp/deps.txt; then
              echo "::error::std found in dependency tree for features='$features'"
              cat /tmp/deps.txt
              exit 1
            fi
          done
          echo "OK: std is not pulled transitively for any feature combo"

  type-sizes:
    name: Type sizes = 8 bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14

      - name: Verify Time<S> is exactly 8 bytes
        run: >
          cargo test --lib
          time::tests::test_size_equals_u64
          -- --nocapture

  size-report:
    name: Size report (.text)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-14
          targets: thumbv7em-none-eabihf

      - name: Install size tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-binutils --locked

      - name: Build probe firmware (release)
        run: >
          cargo build --release
          --manifest-path firmware/Cargo.toml
          --target thumbv7em-none-eabihf

      - name: ELF sections
        run: >
          cargo size --release
          --manifest-path firmware/Cargo.toml
          --target thumbv7em-none-eabihf -- -A

      - name: Top .text symbols
        run: >
          cargo bloat --release
          --manifest-path firmware/Cargo.toml
          --target thumbv7em-none-eabihf -n 15

      - name: Assert .text budget (< 2 KiB)
        run: |
          text=$(cargo size --release \
            --manifest-path firmware/Cargo.toml \
            --target thumbv7em-none-eabihf -- -A | awk '/.text/ {print $2}')
          echo "firmware .text = $text bytes"
          if [ -z "$text" ] || [ "$text" -gt 2048 ]; then
            echo "::error::firmware .text ($text) exceeds 2 KiB budget"
            exit 1
          fi
          echo "OK: .text within budget"

      - name: Assert Time + Duration compiles to a native 64-bit add
        run: |
          cargo objdump --release \
            --manifest-path firmware/Cargo.toml \
            --target thumbv7em-none-eabihf -- -d \
            | grep -A8 'probe_time_saturating_add>' \
            | grep -qE 'adds|adcs'
          echo "OK: Time + Duration = native 64-bit add (zero-cost arithmetic)"
