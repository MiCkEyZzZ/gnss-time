version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: main
    labels: ["dependencies", "cargo"]
    commit-message:
      prefix: "chore(deps)"
    versioning-strategy: increase
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: main
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(deps)"
